# DESCRIPTION:
# This manifest defines the architectural metadata for the site's logical 
# engine. It specifies technical capabilities, version constraints, and the 
# functional scope of the customized design system.
#
# HOW IT WORKS:
# The site engine utilizes this configuration to initialize core features such 
# as responsive breakpoints, visual modalities (Dark/Light), and asset 
# minification logic. It acts as the technical signature for the 
# underlying architectural framework.
#
# TECH STACK:
# - Hugo Architectural Logic
# - TOML Metadata Schema
# - Custom Web Design Patterns
#
# ==============================================================================

# ------------------------------------------------------------------------------
# System Identity & Capability Mapping
# ------------------------------------------------------------------------------

# The technical name of the re-configured site engine.
name = "Amey's Arc"

# Licensing terms governing the functional logic and infrastructure.
license = "MIT"

# Narrative description outlining the engine's optimized performance goals.
description = "A sophisticated, high-performance Hugo framework optimized for scholarly archiving."

# ------------------------------------------------------------------------------
# Taxonomy & Semantic Tagging
# ------------------------------------------------------------------------------

# Keywords defining the technical and aesthetic characteristics of the engine.
tags = [
  "responsive",
  "simple",
  "clean",
  "light",
  "dark",
  "blog",
  "minimalist",
  "highlight.js",
  "search"
]

# ------------------------------------------------------------------------------
# Functional Feature Set
# ------------------------------------------------------------------------------

# Enumerating active capabilities supported by the engine for production.
features = [
  "responsive",
  "single-column",
  "blog",
  "cover-image",
  "table-of-contents",
  "opengraph",
  "highlight.js",
  "favicon",
  "archive",
  "share-icons",
  "cover",
  "multilingual",
  "social-icons",
  "minified-assets",
  "theme-toggle",
  "menu-location-indicator",
  "scroll-to-top",
  "search"
]

# ------------------------------------------------------------------------------
# Compatibility & Versioning
# ------------------------------------------------------------------------------

# Specifying the minimum Hugo version required for stable engine execution.
min_version = "0.146.0"