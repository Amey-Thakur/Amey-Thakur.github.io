# DESCRIPTION:
# This manifest defines the architectural metadata for the PaperMod-based 
# framework utilized by Amey's Arc. It specifies the technical capabilities, 
# version constraints, and original attribution for the theme logic.
#
# HOW IT WORKS:
# Hugo utilizes this file to identify the theme's core features and compatibility
# requirements. It provides a structured summary of the design system's
# functional scope, such as responsive breakpoints and visual modalities.
#
# TECH STACK:
# - PaperMod Framework
# - TOML Metadata Schema
#
# ==============================================================================

# ------------------------------------------------------------------------------
# Theme Identity & Licensing
# ------------------------------------------------------------------------------

name = "PaperMod"
license = "MIT"
licenselink = "https://github.com/adityatelange/hugo-PaperMod/blob/master/LICENSE"
description = "A sophisticated, high-performance Hugo framework optimized for scholarly archiving."
homepage = "https://adityatelange.github.io/hugo-PaperMod/"
demosite = "https://adityatelange.github.io/hugo-PaperMod/"

# ------------------------------------------------------------------------------
# Feature Classification & Taxonomy
# ------------------------------------------------------------------------------

tags = [
  "responsive",
  "simple",
  "clean",
  "light",
  "dark",
  "blog",
  "minimalist",
  "highlight.js",
  "search"
]

features = [
  "responsive",
  "single-column",
  "blog",
  "cover-image",
  "table-of-contents",
  "opengraph",
  "highlight.js",
  "favicon",
  "archive",
  "share-icons",
  "cover",
  "multilingual",
  "social-icons",
  "minified-assets",
  "theme-toggle",
  "menu-location-indicator",
  "scroll-to-top",
  "search"
]

# ------------------------------------------------------------------------------
# Compatibility & Attribution
# ------------------------------------------------------------------------------

min_version = "0.146.0"

[author]
  name = "Aditya Telange"
  homepage = "https://github.com/adityatelange/"

# Attribution for the original Paper foundation
[original]
  name = "Paper"
  author = "nanxiaobei"
  homepage = "https://github.com/nanxiaobei"
  repo = "https://github.com/nanxiaobei/hugo-paper/"