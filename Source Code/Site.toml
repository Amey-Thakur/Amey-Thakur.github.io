# License: MIT License
# ==============================================================================
#
# DESCRIPTION:
# This configuration file serves as the master manifest for Amey's Arc. It 
# defines the global environmental parameters, structural path mappings, and 
# site-wide metadata required by the static site engine.
#
# HOW IT WORKS:
# During the build execution, this file is parsed to orchestrate fundamental 
# networking (URLs), content hierarchies, and branding assets. It utilizes 
# TOML syntax to define technical behaviors, navigation frameworks, and 
# social connectivity parameters.
#
# TECH STACK:
# - Hugo (Static Site Generation Engine)
# - Goldmark (Markdown Rendering Framework)
# - TOML (Configuration Schema)
#
# ==============================================================================

# ------------------------------------------------------------------------------
# Core Engine Infrastructure
# ------------------------------------------------------------------------------

# The authoritative root URL for production deployment and resource resolution.
baseURL = 'https://amey-thakur.github.io/'

# Primary site title utilized for browser titling and structural metadata.
title = "AmeyArc"

# Standardized localization code for accessibility and linguistic precision.
languageCode = 'en-us'

# Relational path mapping to maintain a decoupled project architecture.
contentDir = '../content'
publishDir = '../public'

# Filtering logic to preserve repository hygiene by ignoring non-production files.
ignoreFiles = ['\\.pptx$', 'Assignment 5']

# The robots.txt template is only written to the output when this is set.
enableRobotsTXT = true

# ------------------------------------------------------------------------------
# Output Formats
# ------------------------------------------------------------------------------

# Written as a full table rather than an inline one. An inline table replaces
# the whole output map instead of adding to it, and the entries it quietly
# removed were the two that nothing else in the site references: the 404 page
# and robots.txt. Neither was ever published. A mistyped address therefore fell
# through to GitHub's own error page, and crawlers arrived to find no
# directives and no pointer to the sitemap.
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  rss = ["RSS"]
  sitemap = ["SITEMAP"]
  robotstxt = ["ROBOTS"]
  "404" = ["HTML"]

# ------------------------------------------------------------------------------
# Taxonomy & Data Management
# ------------------------------------------------------------------------------

[taxonomies]
  # Mapping content metadata to structural categorization.
  tag = "tags"

[pagination]
  # High-capacity paging size to prevent scholarly content fragmentation.
  pagerSize = 1000

# ------------------------------------------------------------------------------
# Rendering & Post-Processing
# ------------------------------------------------------------------------------

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Enabling unsafe HTML to permit advanced technical visualizations.
      unsafe = true

# ------------------------------------------------------------------------------
# Branding & User Interface Parameters
# ------------------------------------------------------------------------------

[params]
  # Defining the primary content domain for index generation.
  mainSections = ["posts"]
  author = "Amey Thakur"
  
  # Global visual modality (Light/Dark/Auto).
  defaultTheme = 'auto'
  
  # Core engagement and navigational enhancements.
  ShowShareButtons = true
  ShowReadingTime = true
  displayFullLangName = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  
  [params.assets]
    # Unique technical branding iconography (The Signature Balloon).
    favicon = "favicon_balloon.ico"
  
  [params.label]
    # Technical label used in navigation and branding headers.
    text = "AmeyArc"

  [params.homeInfoParams]
    # Primary landing page headline featuring Amey's signature balloon.
    Title = "<span class='thought-balloon'>💭</span> Advancing ideas @ AmeyArc<span class=\"cursor\">_</span>"

    # Narrative overview outlining the repository's mission and philosophy.
    Content = "Namaskar, I’m Amey. This is my space for notes, reflections, and ideas in progress. Some thoughts are fully formed, others are just sparks, but all are here to explore, share, and grow. I hope these notes spark your thinking, and this space grows with every reflection, including yours."

# ------------------------------------------------------------------------------
# Navigation Framework
# ------------------------------------------------------------------------------

[menu]
  # Global navigation structure for architectural accessibility.
  
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/"
    weight = 10
    
  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20
    
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30
    
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 40
    
  [[menu.main]]
    identifier = "connect"
    name = "Connect"
    url = "/connect/"
    weight = 50

